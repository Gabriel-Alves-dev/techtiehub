<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- no celular: "Adicionar à tela inicial" abre como app, sem a barra do navegador -->
  <meta name="theme-color" content="#1d2030" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Techtie Hub" />
  <title>Techtie Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TECHTIE HUB</h1>
    <div class="stats" id="stats"></div>
    <div class="usage-bar" id="usage-bar" hidden title="Limite de uso da conta Claude deste PC"></div>
    <div class="actions">
      <button id="btn-env" title="Este PC, outros PCs e levar o escritório para outro computador">PC</button>
      <button id="btn-new-project">+ Mesa</button>
      <button id="btn-new-agent">+ Contratar</button>
      <div class="menu">
        <button id="btn-more">☰ Mais</button>
        <div class="menu-list" id="more-menu" hidden>
          <button id="btn-office-memory" title="Memória do escritório: notas gerais, memória de cada projeto e relatórios do dia">🧠 Memória</button>
          <button id="btn-mcp" title="Servidores MCP: ferramentas extras para os agentes">🔌 MCP</button>
          <button id="btn-vars" title="Variáveis de ambiente do escritório: webhooks, credenciais, chaves de API">🔑 Variáveis</button>
          <button id="btn-team">👥 Equipe</button>
          <button id="btn-log">📜 Atividade</button>
          <button id="btn-account" title="Conta, convites e sair">👤 Conta</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="roombar">
    <div class="room-tabs" id="room-tabs"></div>
    <div class="zoom" title="Zoom (também com Ctrl + roda do mouse)">
      <button id="zoom-out" aria-label="Diminuir zoom">−</button>
      <span id="zoom-label">Auto</span>
      <button id="zoom-in" aria-label="Aumentar zoom">+</button>
      <button id="zoom-fit">Ajustar</button>
    </div>
  </nav>

  <main>
    <section class="office" id="office-wrap">
      <canvas id="office"></canvas>
      <div id="bubbles"></div>
      <div class="tooltip" id="tooltip" hidden></div>
      <p class="hint" id="hint">Clique num personagem, balão ou mesa para conversar com o agente</p>
    </section>
  </main>

  <div id="windows"></div>

  <div class="login" id="login" hidden>
    <div class="login-card"></div>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form"></form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
